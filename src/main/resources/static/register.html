<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Job Tracker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 60px auto;
            padding: 0 20px;
            background: #f4f6fa;
            color: #182230;
        }

        form {
            display: grid;
            gap: 12px;
        }

        input, button {
            font: inherit;
            padding: 12px;
        }
    </style>
</head>
<body>
<p><a href="/login.html">Go to login</a></p>

    <h1>Create an account</h1>

    <form id="register-form">
        <label for="username">Username</label>
        <input
            id="username"
            name="username"
            autocomplete="username"
            minlength="3"
            maxlength="50"
            pattern="[A-Za-z0-9_]{3,50}"
            required
        >
        <small>3–50 letters, numbers or underscores.</small>

        <label for="password">Password</label>
        <input
            id="password"
            name="password"
            type="password"
            autocomplete="new-password"
            minlength="12"
            required
        >
        <small>At least 12 characters; at most 72 UTF-8 bytes.</small>

        <button id="register-button" type="submit">
            Create account
        </button>
    </form>

    <p id="message" role="status"></p>
	<script src="/security.js"></script>

    <script>
        const form = document.getElementById("register-form");
        const button = document.getElementById("register-button");
        const message = document.getElementById("message");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            if (new TextEncoder().encode(password).length > 72) {
                message.textContent =
                    "Password must be at most 72 UTF-8 bytes.";
                return;
            }

            button.disabled = true;
            message.textContent = "Creating account...";

            try {
                const response = await apiFetch("/api/auth/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ username, password })
                });

                if (response.status === 409) {
                    message.textContent = "That username is already taken.";
                    return;
                }

                if (response.status === 400) {
                    message.textContent =
                        "Check the username and password requirements.";
                    return;
                }

                if (!response.ok) {
                    throw new Error(
                        "Registration failed: " + response.status
                    );
                }

                form.reset();
                message.textContent = "Account created! You can now log in.";
            } catch (error) {
                message.textContent =
                    "Could not create the account. Please try again.";
                console.error(error);
            } finally {
                button.disabled = false;
            }
        });
		document.getElementById("logout-button")
    .addEventListener("click", async () => {
        try {
            const response = await apiFetch("/logout", {
                method: "POST"
            });

            if (!response.ok) {
                throw new Error("Logout failed");
            }

            window.location.href = "/login.html?logout";
        } catch (error) {
            alert("Could not log out. Please try again.");
            console.error(error);
        }
    });
    </script>
</body>
</html>
